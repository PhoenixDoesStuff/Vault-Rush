<title>Vault Rush Editor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: toolbar on top, palette left, 3D viewport centre, inspector right; stacks on phones. */
:root{
  --bg:#0d0a24;--panel:#150f36;--panel2:#1b1450;--line:#2b2370;
  --fg:#e8ecff;--dim:#9aa3d6;--accent:#4dfcff;--hot:#ff3fa4;--ok:#3dff8a;--warn:#ffb020;
  --display:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 var(--mono);display:flex;flex-direction:column;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:8px;gap:8px;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);padding:6px 10px;cursor:pointer;color:var(--fg)}
button:hover{border-color:var(--accent);color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.on{background:var(--accent);color:#06122a;border-color:var(--accent)}
button.danger:hover{border-color:var(--hot);color:var(--hot)}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{margin:0 8px 0 0;line-height:0}
#logo{height:72px;width:auto;image-rendering:pixelated;display:block}
h1 span{color:var(--hot)}
.grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
#name{background:var(--panel);border:1px solid var(--line);padding:6px 8px;width:min(200px,40vw)}
main{flex:1;min-height:0;display:grid;grid-template-columns:150px minmax(0,1fr) 230px;gap:8px}
aside{background:var(--panel);border:1px solid var(--line);padding:8px;overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
aside h2{font:700 11px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:4px 0 0}
#pal button{text-align:left;display:flex;align-items:center;gap:8px}
#pal i{width:10px;height:10px;display:inline-block;flex:none}
#vp{position:relative;border:1px solid var(--line);min-height:260px;min-width:0;background:#0b0820}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hint{position:absolute;left:8px;bottom:6px;color:var(--dim);font-size:11px;pointer-events:none;max-width:92%}
#insp .f{display:grid;grid-template-columns:34px 1fr;gap:6px;align-items:center}
#insp input,#insp select{width:100%;background:var(--bg);border:1px solid var(--line);padding:4px 6px;min-width:0}
#insp .empty{color:var(--dim)}
#count{color:var(--dim)}
#marq{position:absolute;display:none;pointer-events:none;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);z-index:3}
#toolOpt{display:flex;flex-direction:column;gap:4px;font-size:11px}#toolOpt .f{display:grid;grid-template-columns:1fr 62px;gap:4px;align-items:center}#toolOpt select{background:var(--bg);border:1px solid var(--line);padding:3px}
#pal .tools{display:grid;grid-template-columns:1fr 1fr;gap:4px}#pal .tools button{justify-content:center;padding:5px 4px}
#st{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(5,4,18,.82);padding:16px}
#st.on{display:flex}
#st .box{width:min(96%,560px);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--accent);padding:14px;display:flex;flex-direction:column;gap:10px}
#st h3{font:700 12px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:6px 0 0}
#st .r{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
#st input[type=color]{width:44px;height:26px;padding:0;border:1px solid var(--line);background:none}
#st button.cap{min-width:120px;font-family:var(--mono)}
#modeMsg{color:var(--warn)}
header label{display:flex;gap:4px;align-items:center}header select{background:var(--panel);border:1px solid var(--line);padding:5px 6px}
body.obsMode h1 span{color:var(--warn)}
#io{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(5,4,18,.82);padding:16px}
#io.on{display:flex}
#io .box{width:min(94%,640px);background:var(--panel);border:1px solid var(--accent);padding:14px;display:flex;flex-direction:column;gap:8px}
#io textarea{width:100%;height:38vh;background:var(--bg);border:1px solid var(--line);padding:8px;resize:none;font-size:12px}
#msg{min-height:1.3em;color:var(--dim)}
#msg.err{color:var(--hot)}#msg.ok{color:var(--ok)}
@media(max-width:820px){
  main{grid-template-columns:1fr;grid-template-rows:auto minmax(280px,1fr) auto}
  #pal{flex-direction:row;flex-wrap:wrap}
  body{overflow-y:auto;height:auto}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    <button id="mLvl" class="on" role="tab">Level / Trial</button>
    <button id="mObs" role="tab">Obstacle</button>
  </div>
  <input id="name" value="My level" aria-label="Level name" maxlength="60">
  <div class="grp lv" id="trG">
    <label><input type="checkbox" id="trOn"> Trial</label>
    <select id="trDiff" aria-label="Trial difficulty"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select>
  </div>
  <div class="grp ob" id="obG" style="display:none">

    <select id="oDiff" aria-label="Obstacle difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select>
  </div>
  <div class="grp">
    <button id="bUndo" title="Ctrl+Z">Undo</button>
    <button id="bExpL" class="lv">Export level</button>
    <button id="bExpO" class="ob" style="display:none" title="Exports every object, centred, as an obstacle file for the main game">Export obstacle</button>
    <button id="bImp">Import</button>
    <button id="bSet" title="Keybinds, colours, snap">Settings</button>
    <button id="bNew" class="danger">New</button>
  </div>
  <span class="sp"></span>
  <span id="modeMsg" role="status"></span>
  <span id="count"></span>
</header>

<main>
  <aside id="pal"><h2>Place</h2></aside>
  <div id="vp"><canvas id="cv"></canvas><div id="hint"></div></div>
  <aside id="insp"><h2>Selected</h2><div id="ibody"></div></aside>
</main>

<div id="io" role="dialog" aria-label="Import or copy level data">
  <div class="box">
    <strong id="ioTitle" style="font:700 15px var(--display);letter-spacing:.08em;text-transform:uppercase"></strong>
    <div id="msg"></div>
    <textarea id="ta" spellcheck="false" aria-label="Level JSON"></textarea>
    <div class="grp">
      <label><button type="button" id="bFile">Choose file</button><input type="file" id="file" accept=".json,application/json" hidden></label>
      <button id="bLoad">Load into editor</button>
      <button id="bCopy">Copy</button>
      <button id="bSave">Save file</button>
      <span class="sp"></span>
      <button id="bClose">Close</button>
    </div>
    <div style="color:var(--dim);font-size:11px">Import level files in the game itself: open Vault Rush and press 6 on the main menu.</div>
  </div>
</div>

<div id="st" role="dialog" aria-label="Editor settings"><div class="box">
  <strong style="font:700 15px var(--display);letter-spacing:.08em;text-transform:uppercase">Editor settings</strong>
  <h3>Keybinds <small style="text-transform:none;letter-spacing:0">(click, then press a key; Esc cancels)</small></h3><div id="stKb"></div>
  <h3>Menu colours</h3><div id="stCol"></div>
  <h3>Viewport</h3><div id="stVp"></div>
  <div class="grp" style="justify-content:flex-end"><button id="stReset" class="danger">Reset all</button><button id="stClose">Close</button></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  let d;try{d=JSON.parse(txt);}catch(e){throw new Error('Not valid JSON.');}
  if(!d||d.format!=='vaultrush-level'||d.version!==1||!Array.isArray(d.objects))throw new Error('This is not a Vault Rush level file.');
  if(d.objects.length>2000)throw new Error('Too many objects (max 2000).');
  const n=(v,def,lo,hi)=>{v=+v;if(!isFinite(v))v=def;return Math.max(lo,Math.min(hi,v));};
  const tx=Array.isArray(d.textures)?d.textures.slice(0,8).map(v=>CTOK(v)?v:''):[];
  return {name:String(d.name||'Imported').slice(0,60),textures:tx,objects:d.objects.map(o=>{
    if(!o||!TYPES[o.t])throw new Error('Unknown object type: '+(o&&String(o.t).slice(0,20)));
    const T=TYPES[o.t];
    return {t:o.t,x:n(o.x,0,-5000,5000),y:n(o.y,0,-500,500),z:n(o.z,0,-5000,5000),w:n(o.w,T.d.w,.1,500),h:o.t==='ramp'?n(o.h,2,-100,100):n(o.h,T.d.h,.1,500),d:n(o.d,T.d.d,.1,500),r:n(o.r,0,0,3)|0,...cleanProps(o)};})};
}
let ioMode='';
function openIO(mode,text){
  ioMode=mode;$('io').classList.add('on');$('msg').className='';$('msg').textContent='';
  $('ioTitle').textContent=mode==='imp'?'Import into editor':mode==='obs'?'Export obstacle':'Export level';
  $('ta').value=text||'';$('ta').readOnly=false;
  const imp=mode==='imp';$('bFile').style.display=imp?'':'none';$('bLoad').style.display=imp?'':'none';$('bCopy').style.display=imp?'none':'';$('bSave').style.display=imp?'none':'';
  if(!imp)$('ta').readOnly=true;
}
function msg(t,c){$('msg').textContent=t;$('msg').className=c||'';}
$('bClose').onclick=()=>$('io').classList.remove('on');
$('bExpL').onclick=()=>{const d=levelData('level',objs);if($('trOn').checked)d.trial={difficulty:$('trDiff').value};openIO('lvl',JSON.stringify(d,null,1));};
$('bExpO').onclick=()=>{
  if(mode!=='obs')return;
  const list=objs.filter(o=>!['spawn','goal','checkpoint'].includes(o.t));
  if(!list.length){openIO('obs','');msg('Nothing to export yet. Place some objects first.','err');return;}
  const mn=f=>Math.min(...list.map(f)),mx=f=>Math.max(...list.map(f));
  const x0=mn(o=>o.x-o.w/2),x1=mx(o=>o.x+o.w/2),z0=mn(o=>o.z-o.d/2),z1=mx(o=>o.z+o.d/2);
  const cx=(x0+x1)/2,cz=(z0+z1)/2,my=mn(o=>o.y);
  const moved=list.map(o=>({...o,x:snapExp(o.x-cx),z:snapExp(o.z-cz),y:r2(o.y-my)}));
  const d=levelData('obstacle',moved);d.obstacle={category:$('oCat').value,difficulty:$('oDiff').value,width:r2(x1-x0),length:r2(z1-z0),count:list.length};
  openIO('obs',JSON.stringify(d,null,1));
};
$('bImp').onclick=()=>{openIO('imp','');msg('Paste level JSON or choose a file.');};
$('bFile').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>5e6){msg('File is too large (5 MB max).','err');return;}
  const r=new FileReader();r.onload=()=>{$('ta').value=r.result;doLoad();};r.readAsText(f);e.target.value='';};
function doLoad(){
  try{const d=parse($('ta').value);pushUndo();if(d.textures.length){CT=d.textures.slice();saveCT();}$('name').value=d.name;nid=1;objs=d.objects.map(o=>({...o,id:nid++}));sel=null;selSet=new Set();rebuildAll();
    const b=new THREE.Box3();meshes.forEach(m=>b.expandByObject(m));if(!b.isEmpty()){const c=b.getCenter(new THREE.Vector3()),s=b.getSize(new THREE.Vector3());view.tx=c.x;view.ty=c.y;view.tz=c.z;view.dist=Math.max(20,Math.max(s.x,s.z)*.9);}
    msg('Loaded '+objs.length+' objects.','ok');save();}
  catch(e){msg(e.message,'err');}
}
$('bLoad').onclick=doLoad;
$('bCopy').onclick=async()=>{const t=$('ta').value;try{await navigator.clipboard.writeText(t);msg('Copied.','ok');}catch(e){$('ta').select();msg('Select-all done. Press Ctrl+C to copy.');}};
$('bSave').onclick=async()=>{
  const fn=(($('name').value.trim()||'level').replace(/[^\w\- ]+/g,'').replace(/\s+/g,'-').toLowerCase()||'level')+(ioMode==='obs'?'.obstacle':'.level')+'.json';
  try{const dl=await claude.use('downloads');if(!dl){msg('Saving files is not available here. Use Copy and paste into a .json file.','err');return;}
    await dl.save({filename:fn,data:$('ta').value});msg('Saved '+fn+'.','ok');}
  catch(e){if(e&&e.code==='declined')msg('Save cancelled.');else msg('Could not save a file here. Use Copy instead.','err');}
};


/* ---------- modes ---------- */
const modeMsg=t=>{$('modeMsg').textContent=t||'';};
function applyModeUI(){
  const ob=mode==='obs';document.body.classList.toggle('obsMode',ob);
  document.querySelectorAll('.lv').forEach(e=>e.style.display=ob?'none':'');document.querySelectorAll('.ob').forEach(e=>e.style.display=ob?'':'none');
  $('mLvl').classList.toggle('on',!ob);$('mObs').classList.toggle('on',ob);
  ['spawn','goal','checkpoint'].forEach(k=>{const b=pal.querySelector('[data-t="'+k+'"]');if(b)b.style.display=ob?'none':'';});
  $('name').setAttribute('aria-label',ob?'Obstacle name':'Level name');
}
function setMode(m){
  if(m===mode)return;
  save();mode=m;undo=[];sel=null;selSet=new Set();tool=null;modeMsg('');
  let st=null;try{st=JSON.parse(localStorage.getItem(SK[m])||'null');}catch(e){}
  if(st&&Array.isArray(st.objs)&&st.objs.length&&st.objs.every(o=>TYPES[o.t])){objs=st.objs;nid=st.nid||objs.length+1;$('name').value=st.name||(m==='obs'?'My obstacle':'My level');
    const mt=st.meta||{};if(mt.cat)$('oCat').value=mt.cat;if(mt.diff)$('oDiff').value=mt.diff;$('trOn').checked=!!mt.trOn;if(mt.trDiff)$('trDiff').value=mt.trDiff;}
  else{nid=1;$('name').value=m==='obs'?'My obstacle':'My level';
    objs=(m==='obs'?[{t:'platform',x:0,y:0,z:0,w:10,h:1.2,d:24},{t:'hurdle',x:0,y:0,z:0,w:10,h:.9,d:.6}]:[{t:'platform',x:0,y:0,z:0,w:10,h:1.2,d:30},{t:'spawn',x:0,y:0,z:12,w:1,h:1.8,d:1},{t:'goal',x:0,y:0,z:-12,w:8,h:5.6,d:.6}]).map(o=>({...o,id:nid++}));}
  applyModeUI();updGuide();rebuildAll();view.tx=0;view.ty=0;view.tz=0;view.dist=Math.max(view.dist||0,30);save();
}
$('mLvl').onclick=()=>setMode('level');$('mObs').onclick=()=>setMode('obs');
/* ---------- boot ---------- */
applySettings();
(function(){
  let loaded=false;
  try{const s=JSON.parse(localStorage.getItem('vre-level')||'null');if(s&&Array.isArray(s.objs)&&s.objs.length&&s.objs.every(o=>TYPES[o.t])){objs=s.objs;nid=s.nid||objs.length+1;$('name').value=s.name||'My level';{const mt=s.meta||{};$('trOn').checked=!!mt.trOn;if(mt.trDiff)$('trDiff').value=mt.trDiff;}loaded=true;}}catch(e){}
  if(!loaded){ // example starter level
    const P=(x,y,z,w,d)=>({t:'platform',x,y,z,w,h:1.2,d});
    const L=[P(0,0,-8,10,36),{t:'spawn',x:0,y:0,z:6,w:1,h:1.8,d:1},{t:'hurdle',x:0,y:0,z:-8,w:10,h:.9,d:.6},{t:'hurdle',x:0,y:0,z:-16,w:10,h:.9,d:.6},
      {t:'checkpoint',x:3,y:0,z:-20,w:1,h:2.4,d:1},P(0,0,-48,10,20),{t:'beam',x:0,y:1.1,z:-42,w:10.4,h:1.9,d:1},{t:'spike',x:0,y:0,z:-50,w:2,h:.7,d:2},
      {t:'ramp',x:0,y:0,z:-60,w:6,h:2,d:8,r:0},P(0,2,-72,10,12),{t:'goal',x:0,y:2,z:-76,w:8,h:5.6,d:.6}];
    objs=L.map(o=>({...o,id:nid++}));
  }
  resize();rebuildAll();frame();
})();
})();
